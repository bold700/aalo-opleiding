  {q:'Trainingsonderdelen: Welke neuromusculaire trainingsmethode wordt hier beschreven: "De spieren worden getraind om een bepaalde weerstand langer vol te kunnen houden. Er vindt een betere samenwerking plaats tussen de verschillende spiervezels."',a:'Spierkrachtuithoudingsvermogen',wrong:['Spierkracht','Hypertrofie'],exp:'SKU = langere weerstand volhouden via betere samenwerking spiervezels. Spierkracht = max kracht. Hypertrofie = spiervezelvolume vergroten.'},
  {q:'Trainingsonderdelen: Welke neuromusculaire trainingsmethode wordt hier beschreven: "Het vergroten van het spiervezelvolume door vergroting van de hoeveelheid myofibrillen (contractiele eiwitten) of vergroten van het sarcoplasmatisch volume."',a:'Hypertrofie',wrong:['Spierkrachtuithoudingsvermogen','Spierkracht'],exp:'Hypertrofie = spiervezelvolume groter maken (myofibrillair óf sarcoplasmatisch). Spierkracht = neuraal + myofibrillen; SKU = uithouding.'},
  {q:'Small group training: Bij het maken van een circuittraining gebruikt de trainer bouwstenen. Wat is juist m.b.t. bouwsteen 4 "oefenvormen"?',a:'De trainer kiest maximaal 12 onderdelen waarin alle grote spiergroepen minimaal een keer aan bod komen.',wrong:['De trainer kiest maximaal 12 onderdelen waarin slechts 1 spiergroep aan bod komt.','Beide antwoorden zijn mogelijk'],exp:'Bouwsteen 4 (oefenvormen): max 12 onderdelen, elke grote spiergroep minimaal één keer, anders ontstaat onbalans en onvolledige training.'},
  {q:'Wat is de startpositie van de front squat?',a:'Pak de stang met een gesloten greep iets buiten de schouders vast.',wrong:['Pak de stang met een gesloten greep op de schouders vast.','Beide antwoorden zijn juist'],exp:'Front squat: de stang rust op de voorzijde van de schouders (rack position). Greep iets buiten schouderbreedte met de ellebogen omhoog.'},
  {q:'Soorten gewrichten: Hoeveel assen heeft een scharniergewricht?',a:'1-assig',wrong:['2-assig','3-assig'],exp:'Scharniergewricht (ginglymus) beweegt in 1 as: flexie/extensie, bijvoorbeeld de elleboog. Eivormig = 2-assig, kogelgewricht = 3-assig.'},
  {q:'Hoe heet het beenvlies dat het bot omhult?',a:'Periost',wrong:['Endost','Perimysium'],exp:'Periost (beenvlies) is de bindweefsellaag rond het bot, belangrijk voor groei, voeding en herstel. Endost = bekleding van de mergholte. Perimysium = bindweefsel rond spierbundels.'},
  {q:'Soorten gewrichten: Noem een voorbeeld van een kogelgewricht.',a:'Schouder',wrong:['Pols','Elleboog'],exp:'Kogelgewricht beweegt in 3 assen. De schouder (humerus in cavitas glenoidalis) is het bekendste voorbeeld. Pols = eivormig, elleboog = scharnier.'},
  {q:'Biomechanica: Wat is zwaartekracht?',a:'De zwaartekracht is een aantrekkende kracht die twee massa\'s op elkaar uitoefenen.',wrong:['De zwaartekracht zorgt ervoor dat we op de aardkorst blijven door tegendruk vanuit de ondergrond.','De zwaartekracht is de eigenschap van een spier om weerstand te bieden aan in- en uitwendige krachten.'],exp:'Zwaartekracht (gravitatie) is de aantrekkende kracht tussen twee massa\'s. Tegendruk van de ondergrond = normaalkracht. Spierkracht = contractievermogen.'},
  {q:'Fysiologie: Hoe lang duurt het glucose-systeem (omzetten van glucose naar lactaat zonder zuurstof)?',a:'10 tot 120 seconden',wrong:['0 tot 10 seconden','Langer dan 2 minuten'],exp:'Anaeroob lactisch systeem (glycolyse) levert energie voor inspanningen tussen ongeveer 10 en 120 seconden. 0 tot 10 sec = ATP/CP-systeem, langer dan 2 min = aeroob systeem.'},
  {q:'Trainingsvariabelen: De I in F.I.T.T.E. staat voor Intensiteit. Wat wordt hiermee bedoeld?',a:'Beide antwoorden zijn juist',wrong:['Intensiteit is de sterkte van de prikkel. Bij cardiovasculaire training wordt intensiteit bepaald door x% van de maximale hartfrequentie.','Intensiteit is de sterkte van de prikkel. Deze wordt bij het neuromusculair trainen uitgedrukt in % 1 RM.'],exp:'Intensiteit = sterkte van de prikkel. Bij cardiotraining uitgedrukt in %HFmax, bij krachttraining in %1RM. Beide stellingen kloppen dus.'},
  {q:'Om een goede doelstelling te formuleren moet deze SMART zijn. Wanneer is iets "realistisch"?',a:'Een planning van een activiteit moet gebaseerd zijn op realiteit.',wrong:['Een duidelijk draagvlak. Zonder draagvlak kun je wel iets doen, maar dan beklijft het niet.','De meetbaarheid maakt het geheel overzichtelijk en kan ervoor zorgen dat het geheel overzichtelijk is.'],exp:'SMART: R = Realistisch, de planning is uitvoerbaar binnen de werkelijkheid. Draagvlak hoort bij Acceptabel, overzichtelijkheid bij Meetbaar.'},
  {q:'Bij de startpositie van de lunge heb je…',a:'1 been voor, 1 been achter.',wrong:['De voeten op schouder- of heupbreedte.','Beide antwoorden zijn mogelijk'],exp:'Lunge is een uitvalpas: één been voorwaarts, één been achterwaarts in lijn met de heup. Voeten naast elkaar op schouder-/heupbreedte hoort bij de squat.'},
  {q:'Welke klant leert het beste door iets visueel voor te doen (bijvoorbeeld een oefening laten zien)?',a:'De klant die visueel is ingesteld.',wrong:['De klant die kinesthetisch is ingesteld.','De klant die auditief is ingesteld.'],exp:'Visuele klant leert via beelden en voordoen. Kinesthetisch = leren door voelen/zelf doen. Auditief = leren door uitleg en geluid.'},
  {q:'Trainingsonderdelen: Wat is waar over het doel van een cooldown?',a:'Doelstelling van de cooldown is het fysiek en mentaal afsluiten van de training.',wrong:['Doelstelling van een cooldown is een mentale kwestie en eigenlijk niet nodig.','Doelstelling van de cooldown is het lichaam een prikkel te geven die lichter is dan het gewend is.'],exp:'Cooldown sluit de training fysiek én mentaal af: hartslag laten zakken, herstel inleiden en mentaal afronden. Geen optionele stap en geen trainingsprikkel.'},
  {q:'Plannen en periodiseren: Wat is progressieve overload?',a:'Systematisch toedienen van een trainingsprikkel die leidt tot een fysiologische verbetering door middel van frequentie, omvang of intensiteit.',wrong:['Systematisch toedienen van een trainingsprikkel die leidt tot overtraining.','Systematisch toedienen van een trainingsprikkel die leidt tot een fysiologische verbetering door middel van rust.'],exp:'Progressieve overload bouwt de prikkel stap voor stap op via frequentie, omvang of intensiteit zodat het lichaam blijft adapteren. Te veel = overtraining, rust alleen levert geen progressie op.'},

  // === Set 4 — extra gedeelde examenvragen (mei 2026 oefenexamens) ===
  {q:'Trainingsleer: Welke grondmotorische vaardigheid train je vooral met cardiovasculaire training?',a:'Uithoudingsvermogen',wrong:['Kracht','Snelheid'],exp:'Cardiovasculaire training (lopen, fietsen, roeien) belast vooral het uithoudingsvermogen. Kracht en snelheid horen bij neuromusculaire training.'},
  {q:'Energiesystemen: Hoe lang kunnen vetzuren als energiebron worden gebruikt bij langdurige inspanning?',a:'Langer dan 120 minuten',wrong:['1 tot 2 minuten','2 tot 90 minuten'],exp:'Vetverbranding is een aeroob proces met een grote voorraad, geschikt voor inspanning langer dan 120 minuten. Korte inspanning gebruikt vooral ATP/CP en glucose.'},
  {q:'Myologie: Waar zit de insertie van de m. teres major?',a:'Proximaal anterior van het humerus',wrong:['Proximaal posterior van het humerus','Distaal anterior van het humerus'],exp:'M. teres major loopt van de scapula naar de voorzijde proximaal aan het humerus (crista tuberculi minoris). Daardoor kan hij de arm endoroteren en adduceren.'},
  {q:'Oefentechniek: Wat is van belang in de opwaartse beweging van een dumbell chest fly?',a:'Beide antwoorden zijn juist',wrong:['Hou de polsen recht en de ellebogen licht gebogen.','Duw de dumbells opwaarts naar binnen totdat de armen weer in startpositie staan.'],exp:'Dumbell chest fly opwaarts: polsen recht, ellebogen licht gebogen, dumbells in een boog naar binnen brengen tot de armen in startpositie staan. Beide stellingen kloppen.'},
  {q:'Tests: Welke test wordt gebruikt om spierkracht te meten?',a:'10 RM test',wrong:['Coopertest','VO2 max test'],exp:'10 RM test = neuromusculaire krachttest (max gewicht 10 herhalingen). Coopertest en VO2 max test meten cardiovasculair uithoudingsvermogen.'},
  {q:'Oefentechniek: Wat is van belang in de neerwaartse beweging van een dumbell chest press?',a:'Beide antwoorden zijn juist',wrong:['Hou de polsen recht en boven de ellebogen.','Laat de dumbells langzaam zakken langs het lichaam.'],exp:'Dumbell chest press neerwaarts: polsen recht boven de ellebogen, dumbells gecontroleerd langs het lichaam laten zakken. Beide stellingen kloppen.'},
  {q:'Energiesystemen: Welk type verbranding hoort bij het fosfaatsysteem (ATP/CP)?',a:'Anaerobe alactisch',wrong:['Anaerobe lactisch','Aerobe'],exp:'Het fosfaatsysteem (ATP/CP) werkt zonder zuurstof (anaeroob) en zonder melkzuurvorming (alactisch). 0 tot 10 seconden, maximale intensiteit.'},
  {q:'Klantbenadering: Wat is een kenmerk van iemand die auditief-digitaal is ingesteld?',a:'Richt zich op de inhoud, procedures en volgordes.',wrong:['Richt zich op geluiden en woorden. Het is vooral de toon die de muziek maakt.','Richt zich op gevoel, heeft meestal meer tijd nodig voor hij reactie geeft.'],exp:'Auditief-digitaal = gericht op inhoud, logica, procedures en volgordes. Auditief = toon en geluid. Kinesthetisch = gevoel.'},
  {q:'Anatomie: Welk lichaamsdeel train je met coretraining?',a:'Het lumbale gedeelte van de wervelkolom, het bekken, de heup en de spieren rond borst- en nekwervels',wrong:['De buik, billen en benen','Het cervicale gedeelte van de wervelkolom en spieren rond borst- en nekwervels'],exp:'Core omvat de lumbale wervelkolom, bekken, heup en de stabiliserende spieren rond borst- en nekwervels. Niet alleen buikspieren.'},
  {q:'Trainingsonderdelen: Wat is Time Under Tension (TUT)?',a:'De hoeveelheid tijd die een spier in totaal op spanning heeft gestaan in een totale set.',wrong:['De hoeveelheid tijd die een spier in totaal op spanning heeft gestaan in een totale rep.','De hoeveelheid tijd die een spier in totaal op spanning heeft gestaan in een totale training.'],exp:'TUT = totale spanningstijd per set (alle herhalingen samen). Tempo bepaalt de TUT, bv. tempo 2020 met 10 reps = 40 sec TUT.'},
  {q:'Gezonde basis: Wat is waar over vet?',a:'Vet levert vitamines A, D, E en K.',wrong:['Vet is GEEN bouwstof en brandstof.','Beide antwoorden zijn juist.'],exp:'Vet is een transportmiddel voor de in vet oplosbare vitamines A, D, E en K. Vet is óók bouwstof (celmembranen) en brandstof.'},
  {q:'Longen: Wat is juist over de longslagader?',a:'Via de longslagader wordt zuurstofarm bloed tot in de kleinste haarvaten gevoerd die als een netwerk om de longblaasjes heen liggen.',wrong:['Via de longslagader wordt zuurstofrijk bloed tot in de kleinste haarvaten gevoerd die als een netwerk om de longblaasjes heen liggen.','Beide is juist'],exp:'De longslagader (arteria pulmonalis) voert zuurstofarm bloed vanuit de rechterkamer naar de longen voor gaswisseling. Zuurstofrijk bloed gaat via de longader terug naar het hart.'},
  {q:'Spiervezeltype: Wat is kenmerkend voor spiervezeltype 1 (slow twitch)?',a:'Langzame contractietijd',wrong:['Maximaal te gebruiken in <5 minuten','Zowel aerobe als anaerobe verbruik tijdens activiteit'],exp:'Type 1 (slow twitch) = langzame contractie, aeroob, vermoeit langzaam, geschikt voor duurinspanning. Type 2 (fast twitch) = snel, krachtig, vermoeit snel.'},
  {q:'Artrologie: Wat is actieve stabiliteit?',a:'Stabiliteit die wordt gevormd door de spieren.',wrong:['Stabiliteit die ontstaat door de kapsels en banden die rondom het gewricht zitten en de bewegingen sturen.','Beide antwoorden zijn juist'],exp:'Actieve stabiliteit = spieren (dynamisch, trainbaar). Passieve stabiliteit = kapsels, ligamenten en banden (statisch, niet of nauwelijks trainbaar).'},
  {q:'Myologie: Welke spier(en) worden gestretcht bij een zijwaartse rek met arm omhoog?',a:'Beide antwoorden zijn juist',wrong:['M. latissimus dorsi','M. teres major'],exp:'Bij zijwaartse rek met arm boven het hoofd worden zowel m. latissimus dorsi als m. teres major mee gestretcht (beide endorotatoren/adductoren van de bovenarm).'},
  {q:'Trainingsleer: Wat wordt bedoeld met "tactisch aspect van training"?',a:'Het tactische aspect van training slaat op de strategie die wordt gehanteerd om te winnen van je tegenstander.',wrong:['Het tactische aspect van training slaat op de strategie die wordt gehanteerd om een trainingsprogramma te maken.','Het tactische aspect van training slaat op de strategie die wordt gehanteerd om een oefening uit te voeren.'],exp:'Tactisch = wedstrijdstrategie tegen een tegenstander. Het opbouwen van een trainingsprogramma is methodisch, een oefening uitvoeren is technisch.'},
  {q:'Tests: Wat is de doelstelling van een Shuttlerun test?',a:'Een maximaaltest die het aeroob-uithoudingsvermogen test.',wrong:['Het meten van de VO2 Max','Het meten van de submaximale spierkracht'],exp:'Shuttlerun = maximaaltest, oplopend tempo per "shuttle", meet aeroob uithoudingsvermogen tot het tempo niet meer gehaald wordt.'},
  {q:'Small group training: Wat beschrijf je in de kolom "Lesonderdelen" van een lesvoorbereiding?',a:'Kennismakingsfase, warming up, kern, coolingdown en slot',wrong:['Frequentie, intensiteit, type en tijd.','Specifieke cues, progressies en regressies.'],exp:'Lesonderdelen = de fasen van de les: kennismakingsfase, warming-up, kern, cooling-down en slot. FITT zit in trainingsvariabelen, cues/progressies bij MDH.'},
  {q:'Spotten: Welke tips geef je bij het spotten van een back squat?',a:'Beide antwoorden zijn juist',wrong:['Spotter dient net zo lang en sterk te zijn als de klant.','Rondom klant geen trainende andere klanten.'],exp:'Spotten back squat: spotter moet vergelijkbare lengte en kracht hebben (om de barbell te kunnen overnemen) en de omgeving moet vrij zijn van andere trainende klanten.'},
  {q:'Gezonde basis: Wat is waar over fruit en groente?',a:'Beide antwoorden zijn juist',wrong:['Fruit! Eet je er genoeg van, dan verlagen ze het risico op hart- en vaatziekten, darmkanker en diabetes type 2.','Voor volwassenen geldt een advies van minstens tweehonderdvijftig gram groente per dag.'],exp:'Fruit verlaagt risico op hart- en vaatziekten, darmkanker en diabetes type 2. Volwassenenadvies: minstens 250 gram groente per dag. Beide stellingen kloppen.'},
  {q:'Een AALO Fitness Instructeur is M.O.R.E. Waar staat de O in de afkorting M.O.R.E. voor?',a:'Opvoeder: Als trainer voed je de klant op. Dit doe je op verschillende vlakken.',wrong:['Observant van gedrag: Als trainer is het belangrijk dat je contact maakt met de klant.','Operationeel: Jij bent de perfecte persoon om te vertellen over een actie in het fitnesscentrum.'],exp:'M.O.R.E. = Marketing, Opvoeder, Relatie, Expert. De O staat voor Opvoeder: als trainer voed je de klant op op verschillende vlakken (gedrag, voeding, houding).'},
  {q:'Assen en vlakken: Wanneer je een lateroflexie in de wervelkolom maakt, beweeg je…',a:'…om de sagittale as en in het frontale vlak',wrong:['…om de longitudinale as en in het transversale vlak','…om de transversale as en in het sagittale vlak'],exp:'Lateroflexie (zijwaartse buiging) van de wervelkolom = beweging om de sagittale as in het frontale vlak. Rotatie = longitudinale as / transversaal vlak. Flexie/extensie = transversale as / sagittaal vlak.'},
  {q:'Loopband: De steunfase in een loopcyclus verdelen we in…',a:'…een voorste fase en een achterste fase',wrong:['…een voorste fase en een opwaartse fase','…een achterste fase en een opwaartse fase'],exp:'De steunfase bestaat uit een voorste fase (vanaf hielcontact tot midstance) en een achterste fase (vanaf midstance tot tenenafzet).'},
  {q:'Osteologie: Hoe heet het bovenste en het onderste deel van het bot?',a:'Epifyse',wrong:['Diafyse','Metafyse'],exp:'Epifyse = de uiteinden van een pijpbeen (boven en onder). Diafyse = de schacht (middelste deel). Metafyse = de overgangszone met de groeischijf.'},

  // === Set 5: gedeelde examenvragen 15-05-2026 (WhatsApp screenshots) ===
  {q:'Wat is een kenmerk van iemand die auditief is ingesteld?',a:'Richt zich op geluiden en woorden. Het is vooral de toon die de muziek maakt.',wrong:['Denkt in beelden, ziet plaatjes voor zich.','Richt zich op gevoel, heeft meestal meer tijd nodig voor hij reactie geeft.'],exp:'Auditief = gericht op geluiden, woorden en toon. Visueel = denken in beelden. Kinesthetisch = gevoel en meer reactietijd nodig.'},
  {q:'Wat is een aandachtspunt voor de dumbell shoulder press?',a:'Hou de onderrug in een natuurlijke stand.',wrong:['Gewichten op heuphoogte.','Zet de voeten buiten schouderbreedte.'],exp:'Bij de dumbell shoulder press hou je de onderrug in zijn natuurlijke (licht holle) stand. Gewichten starten ter hoogte van de schouders, voeten op heup- of schouderbreedte.'},
  {q:'Biomechanica: Hoe kan je het evenwicht van een lunge vergroten?',a:'Precies tussen de voeten, midden in het steunvlak, de romp verticaal houden en iets breder gaan staan.',wrong:['Precies tussen de voeten, midden in het steunvlak, de romp verticaal houden en iets lager gaan staan.','Precies tussen de voeten, midden in het steunvlak, de romp verticaal houden en iets smaller gaan staan.'],exp:'Een breder steunvlak vergroot de stabiliteit. Lager staan vergroot het bewegingsbereik maar niet het evenwicht, smaller staan verkleint juist het steunvlak.'},
  {q:'Spieren: Wat is de origo van m. deltoideus pars spinalis?',a:'Spina scapula (richel) van het os scapula',wrong:['Os clavicula','Acromion van de os scapula'],exp:'M. deltoideus pars spinalis ontspringt op de spina scapula. Pars clavicularis ontspringt op de clavicula, pars acromialis op het acromion.'},
  {q:'Wat is de startpositie voor de back squat?',a:'Plaats de voeten tussen heup- en schouderbreedte in (wijder zou ook kunnen) en buig de knieën licht met de tenen iets naar buiten.',wrong:['Plaats de voeten wijder dan schouderbreedte met de tenen iets naar buiten, buig de knieën licht met de tenen iets naar buiten.','Plaats de voeten tussen heup- en schouderbreedte in (wijder zou ook kunnen) en buig de knieën licht met de tenen naar binnen.'],exp:'Back squat startpositie: voeten tussen heup- en schouderbreedte (mag iets wijder), knieën licht gebogen en tenen iets naar buiten zodat de knieën in lijn met de tenen blijven.'},
  {q:'Energiesystemen: Voor hoe lang kan "glucose omgezet naar CO2 en H2O" energie leveren?',a:'2 tot 90 minuten',wrong:['1 tot 2 minuten','Langer dan 2 minuten'],exp:'Aerobe glucoseverbranding (met zuurstof, eindproducten CO2 en H2O) levert energie van ongeveer 2 tot 90 minuten. 1 tot 2 min = anaeroob lactisch (glycolyse), langer dan 90 min = vooral vetverbranding.'},
  {q:'Welke spieren train je bij een lunge?',a:'Alle bovengenoemde spieren',wrong:['Hamstrings en m. iliopsoas','M. gluteus maximus en m. quadriceps.'],exp:'Een lunge belast onder andere de m. gluteus maximus, m. quadriceps, hamstrings en m. iliopsoas (heupflexor). Een samengestelde oefening voor alle grote beenspieren.'},
  {q:'"Het bewust worden van het eigen voedingspatroon en het positief sturen ervan." Wat voor soort doelstelling is dit?',a:'Cognitieve doelstelling',wrong:['Psychomotorische doelstelling','Sociaal-affectieve doelstelling'],exp:'Bewustwording en kennisontwikkeling vallen onder de cognitieve doelstelling. Psychomotorisch = lichamelijke vaardigheid, sociaal-affectief = gedrag en gevoel.'},
  {q:'Tests: Wat is de doelstelling van de Astrand test?',a:'Het meten van de VO2 Max',wrong:['Het meten van de submaximale spierkracht','Een maximaaltest die het aeroob-uithoudingsvermogen test.'],exp:'Astrand is een submaximale fietsergometertest waarmee de VO2 Max wordt geschat aan de hand van submaximale hartfrequentie. Een maximaaltest voor aeroob uithoudingsvermogen is de Cooper- of Shuttle Run-test.'},
  {q:'Fosfaatsysteem: Hoe wordt het fosfaatsysteem ook wel genoemd?',a:'Creatinefosfaatsysteem',wrong:['Melkzuursysteem','Zuurstofsysteem'],exp:'Het fosfaatsysteem (ATP/CP) heet ook creatinefosfaatsysteem omdat creatinefosfaat snel een fosfaatgroep aan ADP afgeeft. Melkzuursysteem = anaeroob lactisch (glycolyse), zuurstofsysteem = aeroob.'},
  {q:'Om een goede doelstelling te formuleren moet deze SMART zijn. Wanneer is iets "acceptabel"?',a:'Een duidelijk draagvlak. Zonder draagvlak kun je wel iets doen, maar dan beklijft het niet.',wrong:['Een concrete en ondubbelzinnige omschrijving van de activiteit.','De meetbaarheid maakt het geheel overzichtelijk en kan er voor zorgen dat het geheel overzichtelijk is.'],exp:'SMART: A = Acceptabel, voldoende draagvlak bij de klant. S = Specifiek (concrete omschrijving), M = Meetbaar (overzichtelijkheid).'},
  {q:'Osteologie: Hoe heet het sterkste deel van het bot dat bestaat uit verschillende osteonen die de functionele eenheid van het beenweefsel vormen?',a:'Compacte substantie',wrong:['Spongieus beenweefsel','Beenmerg'],exp:'De compacte substantie (substantia compacta) is het buitenste dichte botweefsel, opgebouwd uit osteonen (Haversse systemen). Spongieus beenweefsel is poreuzer, beenmerg vult de mergholte.'},
  {q:'Hart: Welke klep(pen) in het hart zorgt/zorgen ervoor dat het bloed van de ventrikels niet terugstroomt de atria in?',a:'Beide',wrong:['Bicuspidalisklep (mitralis)','De tricuspedalisklep'],exp:'Tussen ventrikels en atria zitten de atrioventriculaire kleppen: rechts de tricuspidalisklep en links de bicuspidalis- of mitralisklep. Samen voorkomen ze terugstroom naar de atria.'},
  {q:'Biomechanica: Wat is waar over "steunvlak"?',a:'Er is sprake van evenwicht als de projectie van het zwaartepunt binnen het steunvlak valt.',wrong:['Er is sprake van evenwicht als de projectie van het moment binnen het steunvlak valt.','Er is sprake van evenwicht als de projectie van het zwaartepunt buiten het steunvlak valt.'],exp:'Evenwicht ontstaat als de loodlijn vanuit het zwaartepunt binnen het steunvlak valt. Valt deze projectie buiten het steunvlak, dan kantelt het lichaam.'},
  {q:'Trainingsonderdelen: Welk herhalingstempo past goed bij de neuromusculaire trainingsmethode snelkracht?',a:'X-X-X-X',wrong:['4-2-1-0','2-0-2-0'],exp:'Snelkracht = zo explosief mogelijk uitvoeren, vandaar tempo X-X-X-X (geen vaste tijden, maximaal snel). 4-2-1-0 past bij hypertrofie/SKU, 2-0-2-0 is een gematigd krachttempo.'},
  {q:'Biomechanica: Zwaartekracht of gravitatie wordt aangegeven met…',a:'Fz',wrong:['Fn','Fg'],exp:'Binnen AALO gebruiken we Fz voor zwaartekracht. Fn = normaalkracht (tegendruk vanuit de ondergrond). Fg wordt niet gebruikt als symbool voor zwaartekracht in deze stof.'},
  {q:'Soorten gewrichten: Om hoeveel assen kan een draai- (rol)gewricht bewegen?',a:'1-assig',wrong:['2-assig','3-assig'],exp:'Een draai- of rolgewricht (trochoid) beweegt om 1 as (rotatie). Voorbeelden: atlas-axis (hoofd draaien) en proximaal radius-ulna (pro-/supinatie). 2-assig = eivormig, 3-assig = kogelgewricht.'},
  {q:'Voor welke klant doe je een oefening voor door zelf een andere positie in te nemen of de klant om je heen te laten lopen, zodat hij een nog beter beeld krijgt van wat je bedoelt?',a:'De klant die visueel is ingesteld',wrong:['De klant die kinesthetisch is ingesteld','De klant die auditief is ingesteld'],exp:'Een visueel ingestelde klant leert het meeste via beelden, vandaar dat je vanuit meerdere hoeken voordoet. Kinesthetisch = zelf voelen/doen, auditief = uitleg met woorden en toon.'},

  // === Set 6: gedeelde examenvragen 15-05-2026 (WhatsApp screenshots, tweede batch) ===
  {q:'Biomechanica: Wat is waar over "moment"?',a:'Beide antwoorden zijn juist',wrong:['Het moment, ook wel krachtmoment genoemd, is een maat voor het rotatie-effect van een kracht.','Om het moment van een kracht te bepalen, moet het vermenigvuldigd worden met de lastarm of hefboomafstand.'],exp:'Het moment (krachtmoment) is een maat voor het rotatie-effect van een kracht en wordt berekend door kracht maal lastarm (hefboomafstand). Beide stellingen kloppen.'},
  {q:'Spieren: Wat is de functie van m. rhomboideus?',a:'Retractie en Mediorotatie van het schouderblad',wrong:['Retractie en Laterorotatie van het schouderblad','Protractie en Mediorotatie van het schouderblad'],exp:'M. rhomboideus trekt het schouderblad naar de wervelkolom (retractie) en kantelt de cavitas glenoidalis naar beneden (mediorotatie). Tegengesteld werkt de m. serratus anterior.'},
  {q:'Trainingsprincipes: Wat is de Wet van de verminderde meeropbrengst?',a:'Als je nog nooit getraind hebt vindt de grootste ontwikkeling/groei plaats in de eerste fase.',wrong:['Als je nog nooit getraind hebt vindt de kleinst ontwikkeling/groei plaats in de eerste fase.','Als je nog nooit getraind hebt vindt de grootste ontwikkeling/groei plaats in de laatste fase.'],exp:'Bij een beginner is de prikkel relatief groot ten opzichte van het trainingsniveau, dus groei is in het begin het grootst. Hoe verder gevorderd, hoe kleiner de meeropbrengst per prikkel.'},
  {q:'Systemen: In welk systeem sprint een atleet 100 m?',a:'ATP',wrong:['Glucose omgezet naar lactaat','CP'],exp:'Een 100m sprint is een explosieve maximaal-inspanning waarbij de direct beschikbare ATP-voorraad in de spier wordt aangesproken. CP loopt mee als snelle ATP-resynthese, glucose-lactaat treedt op vanaf ongeveer 10 tot 120 seconden inspanning.'},
  {q:'Spierindeling: Noem een voorbeeld van een waaiervormige spier.',a:'M.deltoideus',wrong:['M. brachialis','M. rectus abdominus'],exp:'Een waaiervormige (veervormige) spier breidt zich uit als een waaier vanuit één punt. M. deltoideus is hét voorbeeld. M. brachialis is spoelvormig, m. rectus abdominus is een platte spier.'},
  {q:'Trainingsonderdelen: Welke stelling over statisch stretchen is juist?',a:'Bij een statische stretch is het belangrijk dat een spier ontspannen is en dat de spier continu op rek gehouden wordt.',wrong:['Bij een statische stretch is het belangrijk dat een spier ontspannen is en dat de spier verend op rek gehouden wordt.','Bij een statische stretch is het belangrijk dat een spier gespannen is en dat de spier continu op rek gehouden wordt.'],exp:'Statisch stretchen = spier ontspannen, eindstand bereiken en daar continu (zonder veren) enkele seconden op rek houden. Verend bewegen = ballistisch stretchen, gespannen op rek = (PNF) contract-relax.'},
  {q:'Bij de start positie van de forward lunge heb je…',a:'De voeten op schouder- of heupbreedte',wrong:['1 been voor, 1 been achter','Beide antwoorden zijn mogelijk'],exp:'De forward lunge start vanuit neutrale stand met voeten op schouder- of heupbreedte; van daaruit stap je voorwaarts uit. Bij een statische lunge sta je al in de uitvalpas (1 been voor, 1 been achter).'},
  {q:'Voor welke klant praat je de klant door de oefening heen (vertelt hoe de oefening heet, wat je daarvoor nodig hebt en hoe hij de oefening stap voor stap uitvoert)?',a:'De klant die auditief is ingesteld',wrong:['De klant die visueel is ingesteld','De klant die kinesthetisch is ingesteld'],exp:'Auditieve klanten leren via woorden en uitleg, dus je praat ze stap voor stap door de oefening heen. Visueel leert via voordoen, kinesthetisch via voelen en zelf doen.'},
  {q:'Spijsvertering: De volgorde waarin voeding organen passeert is als volgt:',a:'Mond, slokdarm, maag, dunne darm, dikke darm, endeldarm, anus',wrong:['Mond, slokdarm, maag, dikke darm, dunne darm, endeldarm, anus','Mond, slokdarm, maag, dunne darm, endeldarm, anus'],exp:'Spijsverteringsroute: mond, slokdarm, maag, dunne darm (opname), dikke darm (waterresorptie), endeldarm (rectum), anus. De dunne darm komt altijd vóór de dikke darm.'},
  {q:'Artrologie: Wat is passieve stabiliteit?',a:'Stabiliteit die ontstaat door de kapsels en banden die rondom het gewricht zitten en de bewegingen sturen.',wrong:['Stabiliteit die wordt gevormd door de spieren.','Beide antwoorden zijn juist'],exp:'Passieve stabiliteit = de kapsels en ligamenten rond een gewricht (statisch, niet of nauwelijks trainbaar). Actieve stabiliteit = de spieren rond een gewricht (dynamisch, wél trainbaar).'},
  {q:'Voor welke spier is de stretch op het plaatje (armen gestrekt voor het lichaam, ronde bovenrug)?',a:'Beide antwoorden zijn juist',wrong:['M. rhomboideus','M. trapezius pars transversum'],exp:'Bij het strekken van de armen voor het lichaam met afgeronde bovenrug worden zowel m. rhomboideus als m. trapezius pars transversum op rek gebracht. Beide spieren werken als retractor van het schouderblad en raken in deze positie gestrekt.'},
  {q:'Biomechanica: Spierkracht word aangegeven met…',a:'Fsp',wrong:['Fs','Fk'],exp:'Spierkracht (force spieren) wordt binnen AALO aangegeven met Fsp. Fs en Fk worden niet als symbool voor spierkracht gebruikt; vergelijk Fz voor zwaartekracht en Fn voor normaalkracht.'},
  {q:'Welke spieren train je bij een bent over row?',a:'Alle bovengenoemde spieren',wrong:['M. rhomboideus en M. deltoideus','M. latissimus dorsi en M. trapezius'],exp:'De bent over row belast meerdere rug- en schouderbladstabilisatoren tegelijk: m. rhomboideus, m. trapezius, m. latissimus dorsi en m. deltoideus (achterste vezels). Alle genoemde spieren komen aan bod.'},
  {q:'Voor welke spier is de stretch op het plaatje (hoofd zijwaarts gekanteld)?',a:'Beide antwoorden zijn juist',wrong:['M. lavator scapula','M. trapezius pars descendens'],exp:'Bij een zijwaartse nekstretch worden zowel de m. levator scapulae als de m. trapezius pars descendens op rek gezet. Beide lopen van de cervicale wervels/schedel naar de schoudergordel.'},
  {q:'Beginsituatie sociaal affectief: Binnen de opleiding tot AALO Small Group Trainer richten we ons op de volgende sociaal-affectieve beginsituaties die van belang zijn in de praktijk:',a:'Persoonlijke en psychische eigenschappen',wrong:['Type mover','Kennis van technieken'],exp:'Sociaal-affectieve beginsituatie = wat de klant aan persoonlijkheid en gevoel meeneemt. Type mover hoort bij de psychomotorische beginsituatie, kennis van technieken bij de cognitieve beginsituatie.'},
  {q:'Spieren: Wat is de functie van m. tensor facia latea?',a:'Abductie en anteflexie in de heup. Helpt bij flexie in de knie.',wrong:['Adductie en anteflexie in de heup. Helpt bij flexie in de knie.','Abductie en retroflexie in de heup. Helpt bij flexie in de knie.'],exp:'M. tensor fasciae latae loopt via de tractus iliotibialis langs de zijkant van het bovenbeen. Hoofdfuncties: heupabductie en heupanteflexie, met assisterende werking op de knie.'},
  {q:'Vocht en sport: Wat gebeurt er met je als je 3% vocht verliest?',a:'Drie procent vochtverlies heeft al een flinke vermindering van het duurvermogen tot gevolg.',wrong:['Bij drie procent afname is er al een verhoogde lichaamstemperatuur waarneembaar en zal het duurvermogen afnemen.','Niets'],exp:'Bij 3% vochtverlies neemt het duurvermogen al duidelijk af. Een waarneembaar verhoogde lichaamstemperatuur treedt pas op vanaf ongeveer 4 tot 5% vochtverlies.'},
  {q:'Welke spieren train je met een bench press?',a:'M. pectoralis major, m. deltoideus en m. triceps brachii',wrong:['M. pectoralis major, m. deltoideus en m. biceps brachii','M. pectoralis major, m. deltoideus en m. triceps surea'],exp:'De bench press is een horizontale duwoefening en belast m. pectoralis major (borst), m. deltoideus pars clavicularis (voorste schouder) en m. triceps brachii (achterzijde bovenarm). De biceps werkt antagonistisch, m. triceps surae zit in de kuit.'},

  // === Set 7: gedeelde examenvragen 16-05-2026 (proefexamen screenshots) ===
  {q:'Trainingsonderdelen: Wat is waar over het doel van een warming up?',a:'Doelstelling van de warming-up is het fysiek en mentaal voorbereiden op de inspanning die gaat volgen.',wrong:['Doelstelling van de warming-up is het lichaam een prikkel te geven die zwaarder is dan het gewend is.','Doelstelling van een warming up is een mentale kwestie en eigenlijk niet nodig.'],exp:'De warming-up bereidt lichaam én geest voor op de komende inspanning (hartslag op, spieren warm, focus aan). De prikkel zwaarder dan gewend hoort bij de kerntraining; een warming-up is wél nodig.'},
  {q:'Welke grondmotorische vaardigheid word getraind met neuromusculaire training?',a:'Kracht',wrong:['Uithoudingsvermogen','Snelheid'],exp:'Neuromusculaire training richt zich op de samenwerking tussen zenuwstelsel en spieren en traint vooral kracht. Uithoudingsvermogen hoort bij cardiovasculaire training, snelheid is een aparte grondmotorische vaardigheid.'},
  {q:'"Het bewust worden van de eigen houding en het positief sturen ervan tijdens het bewegen" Wat voor soort doelstelling is dit?',a:'Cognitieve doelstelling',wrong:['Sociaal-affectieve doelstelling','Psychomotorische doelstelling'],exp:'Bewustwording en sturen van de eigen houding valt onder de cognitieve doelstelling (kennis en inzicht). Psychomotorisch = de vaardigheid zelf uitvoeren, sociaal-affectief = gevoel en gedrag.'},
  {q:'Soorten gewrichten: Om hoeveel assen kan een zadelgewricht bewegen?',a:'2-assig',wrong:['1-assig','3-assig'],exp:'Een zadelgewricht (bijv. duim CMC) beweegt in 2 assen (flexie/extensie + abductie/adductie). 1-assig = scharnier/draaigewricht, 3-assig = kogelgewricht.'},
  {q:'Fosfaatsysteem: Wat is waar?',a:'CP word volledig opgebruikt',wrong:['ATP word volledig opgebruikt','Beide antwoorden zijn juist'],exp:'In het fosfaatsysteem (ATP/CP) wordt de creatinefosfaat (CP) volledig opgebruikt om ATP snel te herstellen. ATP zelf wordt nooit volledig opgebruikt, dat zou direct tot uitval leiden.'},
  {q:'Trainingsaspecten: Wat betekent de afkorting CLUKS?',a:'Coördinatie, Lenigheid, Uithoudingsvermogen, Kracht, Snelheid',wrong:['Coördinatie, Lenigheid, Uithoudingsvermogen, Spiersterkte, Kracht','Core, Lenigheid, Uithoudingsvermogen, Snelheid, Kracht'],exp:'CLUKS = de vijf grondmotorische eigenschappen: Coördinatie, Lenigheid, Uithoudingsvermogen, Kracht en Snelheid.'},
  {q:'Spier onderdelen: Noem een voorbeeld van een bi articulaire spier.',a:'M. quadriceps',wrong:['M. brachialis','M. deltoideus'],exp:'Een bi-articulaire spier overspant twee gewrichten. De m. quadriceps (m. rectus femoris) loopt over zowel heup als knie. M. brachialis (alleen elleboog) en m. deltoideus (alleen schouder) zijn mono-articulair.'},
  {q:'Trainingsprincipes: Wat is Reversibiliteit?',a:'Wanneer je stopt met trainen gaat het trainingsresultaat achteruit',wrong:['Door muscle memorie zal de spier zich altijd herinneren hoe sterk het was en snel winst behalen','Het opgebouwde trainingsresultaat kan je terug winnen na een periode van stoppen met trainen'],exp:'Reversibiliteit = "use it or lose it": stop je met trainen, dan gaat het trainingsresultaat achteruit. Muscle memory en terugwinnen zijn gevolgen die los staan van het principe zelf.'},
  {q:'Hoe is de voetplaatsing van de side lunge bij de zijwaartse beweging (heen)?',a:'Plaats de voet die opzij stapt plat op de grond met de tenen vooruit.',wrong:['Plaats de voet die opzij stapt plat op de grond met de tenen naar binnen.','Plaats de voet die opzij stapt plat op de grond met de tenen naar buiten.'],exp:'Bij de side lunge plaats je de uitstap-voet plat op de grond met de tenen recht naar voren, zodat de knie in lijn blijft met de tenen en het kniegewricht niet draait.'},
  {q:'Small group training: Wat beschrijf je in het maken van een lesvoorbereiding in de kolom "Methodisch didactisch handelen"?',a:'Specifieke cues, progressies en regressies.',wrong:['Frequentie, intensiteit, type en tijd.','Kennismakingsfase, warming up, kern, coolingdown en slot'],exp:'In de kolom MDH (Methodisch Didactisch Handelen) noteer je hoe je instrueert: specifieke cues, progressies en regressies. FITT zit in trainingsvariabelen, lesonderdelen zijn de fasen van de les.'},
  {q:'Trainingsonderdelen: Wat is waar over het doel van neuromusculair trainen?',a:'Beide antwoorden zijn juist',wrong:['Het doel van neuromusculair trainen is het beter samenwerken van verschillende spieren en het verhogen van de motorunits bij het ontvangen van een zenuwprikkel.','Het doel van neuromusculair trainen is het verhogen van de belastbaarheid op het niveau van de spieren, pezen en banden.'],exp:'Neuromusculair trainen verbetert zowel de samenwerking tussen spieren / aansturing van motorunits, als de belastbaarheid van spieren, pezen en banden. Beide stellingen kloppen dus.'},
  {q:'Bloedsomloop: Hoe noemen we de grote bloedvaten die het bloed aanvoeren naar diverse organen?',a:'Arteriën',wrong:['Capillairen','Vessels'],exp:'Arteriën (slagaders) voeren bloed vanaf het hart naar de organen. Capillairen zijn de kleinste haarvaten in het weefsel, "vessels" is het algemene Engelse woord voor bloedvaten.'},
  {q:'Voor welke klant leg je uit waar de oefening voor is, of waarom je een correctie voorstelt? Hier gebruik je de kennis die je over fysiologie, anatomie en bewegingsleer hebt opgedaan.',a:'De klant die auditief digitaal is ingesteld',wrong:['De klant die kinesthetisch is ingesteld','De klant die visueel is ingesteld'],exp:'Auditief-digitaal = gericht op inhoud, logica en procedures. Bij deze klant onderbouw je de oefening en correctie met kennis. Visueel = voordoen, kinesthetisch = laten voelen.'},

  // === Set 8: gedeelde examenvragen 17-05-2026 (WhatsApp screenshots batch 9) ===
  {q:'Trainingsonderdelen: Welk herhalingstempo past goed bij de neuromusculaire methode spierkracht?',a:'2-0-2-0',wrong:['X-X-X-X','4-2-1-0'],exp:'Spierkracht traint met een gematigd tempo zoals 2-0-2-0 (2 sec concentrisch, 0 sec hold, 2 sec excentrisch, 0 sec rust). X-X-X-X = snelkracht (maximaal explosief), 4-2-1-0 = hypertrofie/SKU (langere TUT).'},
  {q:'Als leider van de groep kun je de groep (negatief of positief) typeren aan de hand van een aantal sociaal-emotionele aspecten. Welke zijn dit?',a:'Beide antwoorden zijn juist',wrong:['Rollen in de groep en samenhang van de groep','Algemene sfeer, onderlinge relatie en onderlinge communicatie'],exp:'Sociaal-emotionele aspecten van een groep omvatten BEIDE: 1) rollen in de groep en samenhang. 2) algemene sfeer, onderlinge relatie en communicatie. Beide stellingen kloppen.'},
  {q:'Groepen: Binnen een groep kennen we twee belangrijke aspecten. Wanneer spreken we over sociaal-emotionele aspecten?',a:'het interne groepsfunctioneren, de wijze waarop men met elkaar omgaat.',wrong:['Het bereiken van een doel van de groep, het samen uitvoeren van activiteiten.','Beide antwoorden zijn juist'],exp:'Sociaal-emotionele aspecten = het interne groepsfunctioneren (hoe men met elkaar omgaat). Het bereiken van een doel en gezamenlijke activiteiten zijn taakgerichte aspecten.'},
  {q:'Osteologie: Wat wordt hier beschreven: "…vindt plaats in de epifysaire schijf, dankzij de groeihormonen."',a:'Lengtegroei van het bot',wrong:['Breedtegroei van het bot','Osteoporose'],exp:'Lengtegroei van een pijpbeen vindt plaats in de epifysaire schijf (groeischijf) onder invloed van groeihormonen. Breedtegroei = via het periost. Osteoporose = botafbraak (ziekte).'},
  {q:'Roeien: Bij een roeibeweging leer je de klant een gecoördineerd bewegingspatroon gebaseerd op de volgende posities (in fasen):',a:'De recover, inpik, haal en het afmaken',wrong:['De recover en het afmaken','De recover en de haal'],exp:'De roeibeweging kent 4 fasen: recover (terugkeer), inpik (riem in het water), haal (krachtige trek) en afmaken (riem uit het water). Alle vier vormen samen één cyclus.'},
  {q:'Gewrichten: Het enkelgewricht bestaat uit het bovenste en onderste spronggewricht. Uit welke botten bestaat het bovenste spronggewricht?',a:'Os tibia, os fibula en os talus',wrong:['Os calcaneus, os tibia en os fibula','Os calcaneus en os talus'],exp:'Bovenste spronggewricht = os tibia + os fibula + os talus (sprongbeen). Onderste spronggewricht = os talus + os calcaneus (hielbeen).'},
  {q:'Wat is de startpositie voor de safe squat?',a:'Plaats de voeten tussen heup- en schouderbreedte in (wijder zou ook kunnen) en buig de knieën licht met de tenen iets naar buiten.',wrong:['Plaats de voeten wijder dan schouderbreedte met de tenen iets naar buiten, buig de knieën licht met de tenen iets naar buiten.','Plaats de voeten tussen heup- en schouderbreedte in (wijder zou ook kunnen) en buig de knieën licht met de tenen iets naar binnen.'],exp:'Safe squat startpositie: voeten tussen heup- en schouderbreedte, knieën licht gebogen, tenen iets naar buiten zodat de knieën in lijn met de tenen blijven en het kniegewricht niet draait.'},
  {q:'Vocht en sport: Wat gebeurt er met je als je 4%-6% vocht verliest?',a:'Vermindering van kracht, kramp en uitputting',wrong:['Dit kan leiden tot bewustzijnsverlies','Beide antwoorden zijn juist'],exp:'Bij 4-6% vochtverlies treedt vermindering van kracht op, ontstaan krampen en raak je uitgeput. Bewustzijnsverlies treedt pas op bij grotere vochttekorten (>7-10%).'},
  {q:'Trainingsprincipes: Welk trainingsprincipe wordt hier beschreven? "Door spieren te trainen kunnen er onder invloed van de trainingsprikkel fysiologische veranderingen optreden. Echter, om dit te bewerkstelligen moet deze prikkel groter zijn dan de prikkel die de spier gewend is."',a:'Overload',wrong:['Supercompensatie','Specificiteit'],exp:'Overload = de prikkel moet groter zijn dan waaraan de spier gewend is, anders treedt geen aanpassing op. Supercompensatie = herstel boven uitgangsniveau na de prikkel. Specificiteit = trainen wat je wil verbeteren.'},
  {q:'Plannen en periodiseren: Wat is een macrocyclus?',a:'Een periodisering voor sport die loopt over een half jaar of een jaar.',wrong:['Een periodisering voor sport die loopt over een training.','Een periodisering voor sport die loopt over een aantal weken of maanden.'],exp:'Macrocyclus = lange periodisering (half jaar of jaar). Mesocyclus = enkele weken tot maanden. Microcyclus = één training tot één week.'},
  {q:'Skeletleer: Uit welke botten bestaat de thorax?',a:'Ossa costae en os sternum',wrong:['Ossa costae, os sternum en os scapula','Ossa costae, os sternum en cervicale vertebrae'],exp:'De thorax (borstkas) bestaat uit de ossa costae (ribben) en het os sternum (borstbeen), samen met de thoracale wervels. Os scapula = schouderblad (hoort bij de schoudergordel). Cervicale vertebrae = halswervels.'},
  {q:'Technisch aspect: Wat wordt bedoeld met "technisch aspect van training"?',a:'Met het technische aspect van training wordt de kwaliteit van het bewegingsverloop bedoeld.',wrong:['Met het technische aspect van training wordt de kwaliteit van de trainingsmethode bedoeld.','Met het technische aspect van training wordt de kwaliteit van het materiaal bedoeld.'],exp:'Technisch aspect = de kwaliteit van het bewegingsverloop (hoe netjes voer je een oefening uit). Tactisch = strategie tegen tegenstander. Methodisch = opbouw van het trainingsprogramma.'},
  {q:'Stofwisseling: Waar staat de afkorting BMR voor?',a:'Basal Metabolisme Rate',wrong:['Body Metabolisme Rate','Body Mass Rate'],exp:'BMR = Basal Metabolisme Rate = ruststofwisseling, de hoeveelheid energie die je lichaam in volledige rust per tijdseenheid verbruikt. BMI = Body Mass Index (lichaamsverhouding).'},
  {q:'Om een goede doelstelling te formuleren moet deze SMART zijn. Wanneer is iets "tijdsgebonden"?',a:'Een doel moet een eindpunt hebben.',wrong:['De meetbaarheid maakt het geheel overzichtelijk en kan er voor zorgen dat het geheel overzichtelijk is.','Een duidelijk draagvlak. Zonder draagvlak kun je wel iets doen, maar dan beklijft het niet.'],exp:'SMART: T = Tijdsgebonden, een doel moet een eindpunt/deadline hebben. M = Meetbaar (overzichtelijkheid). A = Acceptabel (draagvlak).'},
  {q:'Tests: Wat is de doelstelling van een 10 RM test?',a:'Het meten van de submaximale spierkracht',wrong:['Het meten van de VO2 Max','Het uithoudingsvermogen testen'],exp:'De 10 RM test meet de submaximale spierkracht: het maximale gewicht dat je 10 herhalingen kunt tillen. VO2 Max wordt gemeten met cardiotests (Astrand, Cooper). Uithoudingsvermogen meet je o.a. met een shuttlerun.'},
  {q:'Wat is van belang bij de opwaartse beweging van de Bent over dumbell row?',a:'Trek de dumbells dicht bij de romp in de richting van de wervelkolom.',wrong:['Trek de stang in een verticale lijn in de richting van de wervelkolom.','Breng de armen naar buiten met een lichte buiging in de ellebogen.'],exp:'Bent over dumbell row opwaarts: trek de dumbells dicht langs het lichaam in de richting van de wervelkolom (rugspieren aanspannen). Een stang trekken hoort bij barbell row; armen naar buiten brengen hoort bij reverse fly.'},
  {q:'Assen en vlakken: Wanneer je een abductie in het schoudergewricht maakt, beweeg je…',a:'…om de sagittale as en in het frontale vlak',wrong:['…om de transversale as en in het sagittale vlak','…om de longitudinale as en in het transversale vlak'],exp:'Abductie/adductie in de schouder = beweging om de sagittale as in het frontale vlak (zijwaarts heffen). Flexie/extensie = transversale as / sagittaal vlak. Rotatie = longitudinale as / transversaal vlak.'},
  {q:'Overgewicht: Waar staat de afkorting BMI voor?',a:'Body Mass Index',wrong:['Basal Metabolisme Index','Body Metabolisme Index'],exp:'BMI = Body Mass Index = gewicht (kg) gedeeld door lengte² (m²). Maat voor over- of ondergewicht. BMR = Basal Metabolisme Rate (ruststofwisseling), geen "Index".'},
  {q:'Osteologie: Welk van de onderstaande botten is een sesamoidbeen?',a:'Os patella',wrong:['Os cranium','Beide antwoorden zijn juist'],exp:'Sesamoidbeen = bot ingebed in een pees, vergroot de hefboomwerking. De os patella (knieschijf) is het bekendste sesamoidbeen. Os cranium = schedel (geen sesamoid).'},

  {q:'Als trainer pas je jouw stijl aan op het competentieniveau van je klant. Wat is een voorbeeld van de stijl "begeleiden"?', a:'Je bespreekt met je klant hoe een oefening beter kan of je stelt een alternatieve oefening voor. Samen bepaal je wat de klant gaat doen en op welke manier.', wrong:['Je bepaalt samen wat en hoe je klant gaat trainen. Je overlegt dus met je klant, samen maak je een nieuw schema.','Je zegt welke oefening op welke manier gedaan moet worden. Je corrigeert door aan te geven hoe het wel moet. Je controleert hoe je klant de oefening uitvoert.'], exp:'Begeleiden (stijl 2): samen met de klant bespreken hoe een oefening beter kan of een alternatief voorstellen. Stijl 3 (steunen) = samen schema maken. Stijl 1 (leiden) = volledig sturen en controleren.'},

// ============================================================
// PROEFEXAMEN RENDER
// ============================================================
let currentExamSource = null;     // verwijst naar proefexamenVragen of gedeeldeExamenvragen
let currentExamLabel = 'Proefexamen';
let currentExamIcon = '🎓';
let currentExamSubtitle = 'Echte oefenvragen uit het AALO proefexamen';
let proefState = { queue:[], idx:0, correct:0, wrong:0, answered:false };

function renderProefexamen(){
  proefState.queue = [...currentExamSource].sort(()=>Math.random()-0.5);
  proefState.idx = 0;
  proefState.correct = 0;
  proefState.wrong = 0;
  proefState.answered = false;
  renderProefVraag();
}

function renderProefVraag(){
  const container = document.getElementById('main-content');

  if(proefState.idx >= proefState.queue.length){
    const pct = Math.round(proefState.correct/proefState.queue.length*100);
    const emoji = pct>=80?'🏆':pct>=60?'👍':'💪';
    const msg = pct>=80?'Geslaagd! Je bent er klaar voor.':pct>=60?'Goed bezig! Nog wat bijschaven.':'Blijf oefenen, je komt er!';
    container.innerHTML = `
      <div class="quiz-wrap">
        <div class="result-card" style="border-color:rgba(255,200,50,0.3);">
          <div style="font-size:13px;font-family:'Space Mono',monospace;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;">${currentExamIcon} ${currentExamLabel} Resultaat</div>
          <div class="result-emoji">${emoji}</div>
          <div class="result-pct" style="color:var(--gold);">${pct}%</div>
          <div class="result-sub">${proefState.correct} van ${proefState.queue.length} vragen correct<br><span style="color:var(--gold)">${msg}</span></div>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
            <button class="restart-btn" onclick="renderProefexamen()" style="background:var(--gold);color:#000;">Opnieuw proberen</button>
            <button class="restart-btn" onclick="selectChapter(1)" style="background:var(--surface);color:var(--text);border:1px solid var(--border);">Naar hoofdstukken →</button>
          </div>
        </div>
      </div>`;
    return;
  }

  const q = proefState.queue[proefState.idx];
  const all = [q.a, ...q.wrong].sort(()=>Math.random()-0.5);
  const pct = proefState.queue.length ? (proefState.idx/proefState.queue.length*100) : 0;

  const answersHtml = all.map((ans, i) => {
    const isCorrect = ans === q.a;
    return `<button class="ans-btn" data-idx="${i}" data-correct="${isCorrect}">${ans}</button>`;
  }).join('');

  container.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-meta">
        <div class="quiz-score" style="color:var(--gold);font-weight:700;">${currentExamIcon} ${currentExamLabel} &nbsp;✅ <span class="good">${proefState.correct}</span> &nbsp;❌ <span class="bad">${proefState.wrong}</span></div>
        <div class="quiz-score" style="color:var(--muted);">Vraag ${proefState.idx+1}/${proefState.queue.length}</div>
      </div>
      <div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--gold),#ff9f4d);"></div></div>
      <div class="q-card" style="border-color:rgba(217,119,6,0.25);">
        <div class="q-text">${q.q}</div>
      </div>
      <div class="answers" id="proef-answers">${answersHtml}</div>
      <div class="feedback" id="proef-fb"></div>
      <button class="next-btn" id="proef-next" onclick="nextProefVraag()" style="background:var(--gold);color:#000;">
        ${proefState.idx+1 < proefState.queue.length ? 'Volgende vraag →' : 'Bekijk resultaat →'}
      </button>
    </div>`;

  // Attach click handlers via JS (avoids escaping issues with long answer strings)
  document.querySelectorAll('#proef-answers .ans-btn').forEach((btn, i) => {
    btn.addEventListener('click', () => {
      if(proefState.answered) return;
      proefState.answered = true;
      const isCorrect = btn.dataset.correct === 'true';
      document.querySelectorAll('#proef-answers .ans-btn').forEach(b => {
        b.disabled = true;
        if(b.dataset.correct === 'true') b.classList.add('correct');
      });
      const fb = document.getElementById('proef-fb');
      const nextBtn = document.getElementById('proef-next');
      if(isCorrect){
        btn.classList.add('correct');
        fb.className = 'feedback show fb-ok';
        fb.innerHTML = `✅ <strong>Correct!</strong> ${q.exp}`;
        proefState.correct++;
      } else {
        btn.classList.add('wrong');
        fb.className = 'feedback show fb-err';
        fb.innerHTML = `❌ <strong>Fout.</strong> Juiste antwoord: <strong>${q.a}</strong><br><small>${q.exp}</small>`;
        proefState.wrong++;
      }
      proefState.idx++;
      nextBtn.classList.add('show');
      nextBtn.textContent = proefState.idx >= proefState.queue.length ? 'Bekijk resultaat →' : 'Volgende vraag →';
    });
  });
}

function nextProefVraag(){
  proefState.answered = false;
  renderProefVraag();
}

// BEGRIPPEN
// ============================================================
function renderBegrippen(search=''){
  const ch = chapters.find(c=>c.id===currentChapterId);
  const terms = search ? ch.terms.filter(t=>t.latin.toLowerCase().includes(search.toLowerCase())||t.nl.toLowerCase().includes(search.toLowerCase())) : ch.terms;

  // Group by tag
  const groups = {};
  terms.forEach(t=>{ if(!groups[t.tag]) groups[t.tag]=[]; groups[t.tag].push(t); });

  let html = `<div class="search-row"><input class="search-box" placeholder="Zoek begrip..." oninput="renderBegrippen(this.value)" value="${search}"></div>`;

  if(terms.length===0){ html+='<div class="empty-msg">Geen resultaten gevonden.</div>'; }

  Object.entries(groups).forEach(([tag,items])=>{
    html += `<div class="section-hdr">${tag} (${items.length})</div><div class="cards-grid">`;
    items.forEach(t=>{
      html += `<div class="term-card" onclick="this.classList.toggle('flipped')">
        <div class="front">
          <span class="tag" style="${tagStyle(t.tag)}">${t.tag}</span>
          <div class="term-latin">${t.latin}</div>
          <div class="term-nl">${t.nl}</div>
          <div class="flip-hint">Tik voor uitleg ↓</div>
        </div>
        <div class="back">
          <span class="tag" style="${tagStyle(t.tag)}">${t.tag}</span>
          <div class="term-latin">${t.latin}</div>
          <div class="term-extra">${t.extra}</div>
          <div class="flip-hint">Tik terug ↑</div>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  document.getElementById('main-content').innerHTML = html;
}

function renderQuiz(){
  const ch = chapters.find(c=>c.id===currentChapterId);
  // Build queue from chapter quiz data
  quizState.queue = [...ch.quiz].sort(()=>Math.random()-0.5);
  quizState.idx = 0;
  quizState.correct = 0;
  quizState.wrong = 0;
  quizState.answered = false;
  renderQuestion();
}

function renderQuestion(){
  const ch = chapters.find(c=>c.id===currentChapterId);
  const container = document.getElementById('main-content');

  if(quizState.idx >= quizState.queue.length){
    const pct = Math.round(quizState.correct/quizState.queue.length*100);
    const emoji = pct>=80?'🏆':pct>=60?'👍':'💪';
    globalStats.total += quizState.queue.length;
    globalStats.correct += quizState.correct;
    updateGlobalProgress();
    container.innerHTML = `
      <div class="quiz-wrap">
        <div class="result-card">
          <div class="result-emoji">${emoji}</div>
          <div class="result-pct">${pct}%</div>
          <div class="result-sub">${quizState.correct} van ${quizState.queue.length} vragen correct — H${chapterDisplayNum(ch)}: ${ch.title}</div>
          <button class="restart-btn" onclick="renderQuiz()">Opnieuw proberen</button>
        </div>
      </div>`;
    return;
  }

  const q = quizState.queue[quizState.idx];
  const all = [q.a, ...q.wrong].sort(()=>Math.random()-0.5);
  const pct = quizState.queue.length ? (quizState.idx/quizState.queue.length*100) : 0;

  const answersHtml = all.map((ans) => {
    const isCorrect = ans === q.a;
    return `<button class="ans-btn" data-correct="${isCorrect}">${ans}</button>`;
  }).join('');

  container.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-meta">
        <div class="quiz-score">✅ <span class="good">${quizState.correct}</span> &nbsp;❌ <span class="bad">${quizState.wrong}</span></div>
        <div class="quiz-score" style="color:var(--muted)">Vraag ${quizState.idx+1}/${quizState.queue.length}</div>
      </div>
      <div class="pbar"><div class="pbar-fill" style="width:${pct}%"></div></div>
      <div class="q-card">
        <div class="q-text">${q.q}</div>
      </div>
      <div class="answers" id="answers">${answersHtml}</div>
      <div class="feedback" id="fb"></div>
      <button class="next-btn" id="next-btn" onclick="nextQ()">Volgende vraag →</button>
    </div>`;

  document.querySelectorAll('#answers .ans-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(quizState.answered) return;
      quizState.answered = true;
      const isCorrect = btn.dataset.correct === 'true';
      document.querySelectorAll('#answers .ans-btn').forEach(b => {
        b.disabled = true;
        if(b.dataset.correct === 'true') b.classList.add('correct');
      });
      const fb = document.getElementById('fb');
      const nextBtn = document.getElementById('next-btn');
      if(isCorrect){
        btn.classList.add('correct');
        fb.className = 'feedback show fb-ok';
        fb.innerHTML = `✅ <strong>Correct!</strong> ${q.exp}`;
        quizState.correct++;
      } else {
        btn.classList.add('wrong');
        fb.className = 'feedback show fb-err';
        fb.innerHTML = `❌ <strong>Fout.</strong> Juiste antwoord: <strong>${q.a}</strong><br><small>${q.exp}</small>`;
        quizState.wrong++;
      }
      quizState.idx++;
      nextBtn.classList.add('show');
      nextBtn.textContent = quizState.idx >= quizState.queue.length ? 'Bekijk resultaat →' : 'Volgende vraag →';
    });
  });
}

function escQ(s){ return (s||'').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

function nextQ(){
  quizState.answered = false;
  renderQuestion();
}

function updateGlobalProgress(){
  const total = chapters.reduce((s,c)=>s+c.quiz.length,0);
  const pct = total>0 ? Math.round(globalStats.correct/Math.max(globalStats.total,1)*100) : 0;
  document.getElementById('progress-overview').textContent = `${globalStats.correct}/${globalStats.total} correct beantwoord`;
  document.getElementById('global-progress').style.width = Math.min(pct,100)+'%';
}

// Start
init();
</script>
</body>
</html>
